name: Update profile widgets

# Coloca este ficheiro em .github/workflows/update-profile-widgets.yml
# dentro de blindtk/blindtk.
#
# Gera localmente, e comita para assets/, todos os widgets dinâmicos do
# README: banner, top-langs, streak de contribuições e contagem de repos
# com estrela. O banner deixou de depender do capsule-render.vercel.app:
# essa versão usa um <style> CSS com animação de fade-in que, confirmado
# em 2026-07-30, fica presa a opacity:0 quando carregada via <img> na
# página real do perfil (mesmo com animation=false no URL) — substituído
# por um SVG estático gerado por nós, sem <style> nem animação. O streak
# (streak-stats.demolab.com) deixou de ser consultado ao vivo pela mesma
# razão: streak.svg é agora calculado aqui a partir do
# contributionsCollection da API GraphQL e comitado como SVG estático,
# tal como o banner. O cartão de troféus (ryo-ma/github-profile-trophy) e
# o cartão de stats gerais (commits/repos/followers) foram removidos —
# dependência de terceiro extra e sinal fraco, respetivamente, para um
# perfil cujo trabalho real é interno.
#
# Dois jobs, não um (revisão de segurança de CI/CD, 2026-07-30): o job
# `generate` corre código de terceiros (a stats-action, para o cartão de
# top-langs) e por isso só recebe `permissions: contents: read` — mesmo
# que esse código seja comprometido ou a tag movida, o token que ele vê
# não sabe escrever no repo. Só o job `commit`, que não corre nenhum
# código de terceiros, tem `contents: write` (+ `pull-requests: write`,
# ver abaixo), e o único artefacto que atravessa a fronteira é o conjunto
# de SVGs já gerados (via actions/upload-artifact + download-artifact).
#
# O job `commit` abre PR em vez de dar push direto a main (revisão de
# segurança de CI/CD, follow-up 2026-07-30): o ruleset do main passou a
# exigir "Require a pull request before merging" com 1 aprovação — um
# `git push` direto passaria a falhar de qualquer forma. Em vez de dar
# bypass ao bot (que deixaria o main protegido só para humanos), o bot
# propõe o branch `automated/profile-widgets` e uma pessoa aprova/mergeia
# sempre. Requer a definição do repositório "Allow GitHub Actions to
# create pull requests" ligada (Settings → Actions → General → Workflow
# permissions) — sem isso o `gh pr create` falha.

on:
  schedule:
    - cron: "0 6 * * 1" # semanal, segunda-feira 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout blindtk/blindtk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # este job nunca comita nem faz push — sem persistir credenciais
          persist-credentials: false

      - name: Gerar banner
        run: |
          mkdir -p assets
          cat > assets/banner.svg <<'SVGEOF'
          <svg width="854" height="170" viewBox="0 0 854 170" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0a0d11"/>
                <stop offset="100%" stop-color="#123d2b"/>
              </linearGradient>
            </defs>
            <rect width="854" height="170" fill="url(#bg)"/>
            <text x="427" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e6edf3">Daniel Malaco</text>
            <text x="427" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#e6edf3">Information Security Engineer &#183; Porto, PT</text>
          </svg>
          SVGEOF

      - name: Gerar cartão de top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=blindtk&layout=compact&hide_border=true&bg_color=0a0d11&title_color=3ddc84&text_color=8593a5&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular streak de contribuições e gerar streak.svg
        env:
          # o token passa por env, nunca interpolado dentro do script —
          # mesmo padrão do passo "Obter contagem de repositórios com
          # estrela" abaixo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python3 - <<'PYEOF'
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          login = "blindtk"

          def gql(query):
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={
                      "Authorization": f"bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          created_at = datetime.datetime.fromisoformat(
              gql(f'query {{ user(login: "{login}") {{ createdAt }} }}')
              ["data"]["user"]["createdAt"].replace("Z", "+00:00")
          )
          now = datetime.datetime.now(datetime.timezone.utc)

          # A API só aceita janelas contributionsCollection(from, to) de no
          # máximo um ano, por isso percorremos a conta inteira em fatias
          # anuais para obter o histórico completo (não só o ano corrente).
          counts = {}
          window_start = created_at
          while window_start < now:
              window_end = min(window_start + datetime.timedelta(days=365), now)
              data = gql(f'''
                query {{
                  user(login: "{login}") {{
                    contributionsCollection(from: "{window_start.isoformat()}", to: "{window_end.isoformat()}") {{
                      contributionCalendar {{
                        weeks {{
                          contributionDays {{
                            date
                            contributionCount
                          }}
                        }}
                      }}
                    }}
                  }}
                }}
              ''')
              weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              for week in weeks:
                  for day in week["contributionDays"]:
                      counts[day["date"]] = counts.get(day["date"], 0) + day["contributionCount"]
              window_start = window_end

          dates = sorted(counts)

          longest = 0
          run = 0
          for d in dates:
              if counts[d] > 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0

          current = 0
          cursor = now.date()
          if counts.get(cursor.isoformat(), 0) == 0:
              cursor -= datetime.timedelta(days=1)
          while counts.get(cursor.isoformat(), 0) > 0:
              current += 1
              cursor -= datetime.timedelta(days=1)

          svg = f'''<svg width="450" height="120" viewBox="0 0 450 120" xmlns="http://www.w3.org/2000/svg">
            <rect width="450" height="120" rx="8" fill="#0a0d11" stroke="#161c28"/>
            <text x="112" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#3ddc84">{current}</text>
            <text x="112" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8593a5">Current streak</text>
            <line x1="225" y1="20" x2="225" y2="100" stroke="#161c28"/>
            <text x="337" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">{longest}</text>
            <text x="337" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8593a5">Longest streak</text>
          </svg>
          '''

          with open("assets/streak.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print(f"current={current} longest={longest} days_seen={len(dates)}")
          PYEOF

      - name: Obter contagem de repositórios com estrela
        id: starred
        env:
          # o token passa por env, nunca interpolado dentro do run: — evita
          # injeção de template (mesmo padrão do headers.yml do personal-site,
          # auditado pelo zizmor)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(curl -sS -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"blindtk\") { starredRepositories { totalCount } } }"}' \
            https://api.github.com/graphql | jq -r '.data.user.starredRepositories.totalCount')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Gerar e validar badge de repositórios com estrela
        env:
          STAR_COUNT: ${{ steps.starred.outputs.count }}
        run: |
          curl -sS -o assets/stars-given.svg \
            "https://img.shields.io/badge/Repos%20starred-${STAR_COUNT}-3ddc84?style=flat-square&labelColor=0a0d11"
          # Conteúdo vindo de um terceiro (img.shields.io), escrito
          # diretamente para um ficheiro que o job seguinte comita — nega
          # o ficheiro se não parecer um SVG estático inócuo (sem <script>,
          # sem handlers de evento, sem <foreignObject>, sem javascript:).
          # Não é sanitização completa, é um filtro proporcional a uma
          # fonte conhecida que nunca deveria conter nada disto.
          if ! grep -q '^<svg' assets/stars-given.svg; then
            echo "::error::stars-given.svg não começa por <svg> — a abortar sem comitar"
            exit 1
          fi
          if grep -Eiq '<script|on[a-z]+ *=|<foreignObject|javascript:' assets/stars-given.svg; then
            echo "::error::stars-given.svg contém conteúdo ativo inesperado — a abortar sem comitar"
            exit 1
          fi

      - name: Preparar artefacto
        run: |
          mkdir -p widgets
          cp assets/*.svg widgets/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-widgets
          path: widgets/*.svg
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      # pull-requests: write só para abrir a PR (gh pr create) — o ruleset
      # do main passou a exigir "Require a pull request before merging"
      # com aprovação humana (2026-07-30), por isso este job já não pode
      # fazer `git push` direto para main. Em vez disso propõe um branch e
      # abre PR; quem aprova/mergeia é sempre uma pessoa.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout blindtk/blindtk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # persist-credentials fica no valor por omissão (true): este job
        # precisa das credenciais do checkout para dar push ao branch
        # automático e para o `gh pr create` abaixo.

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: profile-widgets
          path: assets

      - name: Preparar branch e commit
        id: prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nome de branch fixo (não datado): se a PR da semana anterior
          # nunca foi aprovada, esta execução substitui o conteúdo proposto
          # pelo mais recente em vez de acumular uma PR nova por semana.
          BRANCH="automated/profile-widgets"
          git checkout -b "$BRANCH"
          git add assets/*.svg

          if git diff --staged --quiet; then
            echo "Sem alterações nos assets — nada a propor."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update profile widgets"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Abrir PR (se ainda não existir uma aberta)
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          existing=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --title "chore: update profile widgets" --base main --head "$BRANCH" --body "$(cat <<'BODYEOF'
          Gerado automaticamente por `update-profile-widgets.yml` (job `generate`,
          `permissions: contents: read`, sem escrita no repo).

          Antes de aprovar: abre o separador **Files changed** e confirma visualmente
          que os 4 SVGs (`banner`, `top-langs`, `streak`, `stars-given`) renderizam
          como esperado — os checks automáticos confirmam que o workflow correu sem
          erros, não que o conteúdo gerado está correto.

          ---
          _Aberto automaticamente — sem revisão de conteúdo antes deste ponto._
          BODYEOF
            )"
          else
            echo "PR #${existing} já aberta para ${BRANCH} — atualizada pelo push acima, nada a criar."
          fi
