# Exceções ao zizmor. Mantém isto ao mínimo: cada entrada é um achado que
# escolhemos não bloquear, com a justificação ao lado — mesmo padrão do
# osv-scanner.toml e do .semgrep/ no personal-site.

rules:
  artipacked:
    ignore:
      # Checkout do job `commit` em update-profile-widgets.yml: é o único
      # checkout de todo o repositório que faz `git push`, por isso é o
      # único que precisa das credenciais persistidas (persist-credentials
      # fica no valor por omissão, `true`, de propósito). Não é um
      # descuido — é a razão de existir deste job (revisão de segurança de
      # CI/CD, 2026-07-30). Sem esta exceção, o job `zizmor` fica vermelho
      # para sempre por um achado aceite conscientemente, o que treina a
      # ignorar o check em vez de o ler.
      - update-profile-widgets.yml:214:9
